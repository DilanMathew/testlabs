name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "bethesda/**"
      - "packaging/**"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run end-to-end tests
        run: python tests/test_app.py

      - name: Build app with PyInstaller
        run: pyinstaller packaging/BalajiXRays.spec --noconfirm --distpath dist --workpath build

      - name: Check the built app starts
        shell: pwsh
        env:
          BETHESDA_DATA_DIR: ${{ runner.temp }}\bethesda-exe-test
        run: |
          $p = Start-Process dist\BalajiXRays\BalajiXRays.exe -ArgumentList "--background","--no-tray","--port","5099" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 1
            try { if ((Invoke-WebRequest http://127.0.0.1:5099/ping -UseBasicParsing).Content -eq "balaji-xrays") { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { Get-ChildItem -Recurse $env:BETHESDA_DATA_DIR -ErrorAction SilentlyContinue; Get-Content "$env:BETHESDA_DATA_DIR\logs\app.log" -ErrorAction SilentlyContinue; throw "exe did not start" }
          Write-Host "exe started OK"

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $ver = python -c "import bethesda; print(bethesda.__version__)"
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: BalajiXRays-Windows-Installer
          path: dist/installer/*.exe
          retention-days: 30

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*.exe
