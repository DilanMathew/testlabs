{% extends "base.html" %}{% block title %}Change password{% endblock %}
{% block content %}
<div class="authbox card" style="margin-top:20px">
  <h1>Change password</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div><label>Current password</label><input type="password" name="current" required></div>
    <div style="margin-top:10px"><label>New password (min 6 characters)</label><input type="password" name="new" required></div>
    <div style="margin-top:10px"><label>Repeat new password</label><input type="password" name="new2" required></div>
    <button class="btn" style="width:100%;margin-top:14px">Change password</button>
  </form>
</div>
{% endblock %}
